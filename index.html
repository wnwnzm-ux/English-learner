  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Nunito', sans-serif;
      background: #FFF8F0;
      min-height: 100vh;
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    :root {
      --child1-color: #FF9F43;
      --child2-color: #6C5CE7;
      --parent-color: #00B894;
      --shadow-soft: 0 4px 24px rgba(0,0,0,0.10);
      --shadow-card: 0 8px 32px rgba(0,0,0,0.12);
      --radius-xl: 28px;
      --radius-lg: 20px;
      --radius-md: 14px;
    }

    button { cursor: pointer; border: none; outline: none; font-family: 'Nunito', sans-serif; }

    .app-root { max-width: 480px; margin: 0 auto; min-height: 100vh; position: relative; }

    /* 홈 */
    .home-screen {
      min-height: 100vh;
      background: linear-gradient(160deg, #FFF8F0 0%, #FFF0E0 100%);
      display: flex; flex-direction: column; align-items: center;
      padding: 48px 24px 32px;
    }
    .home-logo { font-family: 'Fredoka One', cursive; font-size: 2.4rem; color: #2D3436; text-align: center; margin-bottom: 6px; }
    .home-logo span { color: var(--child1-color); }
    .home-subtitle { font-size: 1rem; color: #888; font-weight: 600; text-align: center; margin-bottom: 40px; }
    .home-cards { display: flex; flex-direction: column; gap: 18px; width: 100%; max-width: 360px; }

    .profile-card {
      width: 100%; border-radius: var(--radius-xl); padding: 24px 28px;
      display: flex; align-items: center; gap: 20px;
      box-shadow: var(--shadow-card); border: none;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      position: relative; overflow: hidden;
    }
    .profile-card:active { transform: scale(0.97); box-shadow: 0 2px 12px rgba(0,0,0,0.10); }
    .profile-card.child1 { background: linear-gradient(135deg, #FF9F43 0%, #FFBE76 100%); }
    .profile-card.child2 { background: linear-gradient(135deg, #6C5CE7 0%, #A29BFE 100%); }
    .profile-card.parent { background: linear-gradient(135deg, #00B894 0%, #55EFC4 100%); }
    .profile-card::after {
      content: ''; position: absolute; right: -20px; top: -20px;
      width: 100px; height: 100px; border-radius: 50%;
      background: rgba(255,255,255,0.15);
    }
    .profile-emoji { font-size: 3.2rem; line-height: 1; flex-shrink: 0; }
    .profile-info { text-align: left; }
    .profile-name { font-family: 'Fredoka One', cursive; font-size: 1.5rem; color: #fff; line-height: 1.2; }
    .profile-level { font-size: 0.88rem; color: rgba(255,255,255,0.85); font-weight: 700; margin-top: 2px; }
    .profile-progress { font-size: 0.82rem; color: rgba(255,255,255,0.75); margin-top: 4px; }
    .profile-arrow { margin-left: auto; font-size: 1.6rem; color: rgba(255,255,255,0.7); flex-shrink: 0; }

    /* 마이크 권한 배너 */
    .mic-banner {
      width: 100%; background: #FFF3CD; border: 2px solid #FDCB6E;
      border-radius: var(--radius-md); padding: 14px 18px;
      display: flex; align-items: center; gap: 12px;
      margin-bottom: 20px;
    }
    .mic-banner-text { flex: 1; font-size: 0.85rem; font-weight: 700; color: #856404; }
    .mic-grant-btn {
      padding: 8px 16px; border-radius: 99px;
      background: #FF9F43; color: #fff;
      font-family: 'Fredoka One', cursive; font-size: 0.9rem;
      flex-shrink: 0;
    }

    /* 페이지 공통 */
    .page-screen { min-height: 100vh; display: flex; flex-direction: column; }
    .page-header {
      padding: 20px 20px 16px; display: flex; align-items: center; gap: 12px;
      position: sticky; top: 0; z-index: 10; background: inherit;
    }
    .back-btn {
      width: 44px; height: 44px; border-radius: 50%;
      background: rgba(255,255,255,0.9);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.3rem; box-shadow: 0 2px 12px rgba(0,0,0,0.10);
      transition: transform 0.12s; flex-shrink: 0;
    }
    .back-btn:active { transform: scale(0.92); }
    .page-title { font-family: 'Fredoka One', cursive; font-size: 1.5rem; color: #2D3436; }
    .page-content { padding: 8px 20px 40px; flex: 1; }

    /* 유닛 */
    .unit-grid { display: flex; flex-direction: column; gap: 14px; }
    .unit-card {
      border-radius: var(--radius-lg); padding: 20px 22px;
      display: flex; align-items: center; gap: 16px;
      background: #fff; box-shadow: var(--shadow-soft);
      border: none; width: 100%; text-align: left;
      transition: transform 0.14s; border-left: 6px solid transparent;
    }
    .unit-card:active { transform: scale(0.97); }
    .unit-emoji { font-size: 2.4rem; flex-shrink: 0; }
    .unit-info { flex: 1; }
    .unit-name { font-family: 'Fredoka One', cursive; font-size: 1.15rem; color: #2D3436; }
    .unit-meta { font-size: 0.82rem; color: #aaa; margin-top: 2px; font-weight: 600; }
    .unit-progress-bar { width: 100%; height: 6px; background: #f0f0f0; border-radius: 99px; margin-top: 8px; overflow: hidden; }
    .unit-progress-fill { height: 100%; border-radius: 99px; transition: width 0.4s ease; }

    /* 챕터 */
    .chapter-list { display: flex; flex-direction: column; gap: 12px; }
    .chapter-item {
      border-radius: var(--radius-md); padding: 16px 18px;
      display: flex; align-items: center; gap: 14px;
      background: #fff; box-shadow: 0 2px 12px rgba(0,0,0,0.07);
      border: none; width: 100%; text-align: left; transition: transform 0.12s;
    }
    .chapter-item:active { transform: scale(0.97); }
    .chapter-item.locked { opacity: 0.45; }
    .chapter-num {
      width: 40px; height: 40px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-family: 'Fredoka One', cursive; font-size: 1.1rem; color: #fff; flex-shrink: 0;
    }
    .chapter-info { flex: 1; }
    .chapter-title { font-weight: 800; font-size: 0.95rem; color: #2D3436; }
    .chapter-preview { font-size: 0.78rem; color: #aaa; margin-top: 2px; }
    .chapter-status { font-size: 1.4rem; flex-shrink: 0; }

    /* 학습 */
    .study-screen { min-height: 100vh; display: flex; flex-direction: column; }
    .study-header { padding: 16px 20px; display: flex; align-items: center; gap: 12px; }
    .study-progress-wrap { flex: 1; display: flex; align-items: center; }
    .study-step-dots { display: flex; gap: 6px; }
    .dot {
      width: 10px; height: 10px; border-radius: 50%; background: #E0E0E0;
      transition: background 0.3s, transform 0.3s;
    }
    .dot.active { transform: scale(1.3); }
    .dot.done { background: #ccc; }
    .study-body {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 24px 28px; gap: 22px;
    }
    .sentence-box {
      background: #fff; border-radius: var(--radius-xl);
      padding: 28px 24px; box-shadow: var(--shadow-card);
      width: 100%; text-align: center;
    }
    .sentence-num { font-size: 0.78rem; font-weight: 700; letter-spacing: 2px; color: #ccc; margin-bottom: 12px; }
    .sentence-text { font-family: 'Fredoka One', cursive; font-size: 1.75rem; color: #2D3436; line-height: 1.35; }

    .big-action-btn {
      width: 100%; padding: 18px; border-radius: var(--radius-lg);
      font-family: 'Fredoka One', cursive; font-size: 1.2rem; color: #fff;
      box-shadow: 0 6px 20px rgba(0,0,0,0.15); transition: transform 0.12s, box-shadow 0.12s;
      display: flex; align-items: center; justify-content: center; gap: 10px;
    }
    .big-action-btn:active { transform: scale(0.97); box-shadow: 0 2px 8px rgba(0,0,0,0.12); }
    .big-action-btn:disabled { opacity: 0.6; }

    .nav-btns { display: flex; gap: 10px; width: 100%; }
    .nav-btn-sm {
      flex: 1; padding: 14px; border-radius: var(--radius-md);
      font-family: 'Fredoka One', cursive; font-size: 1rem;
      background: rgba(255,255,255,0.9); color: #555;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08); transition: transform 0.12s;
    }
    .nav-btn-sm:active { transform: scale(0.96); }

    /* 완료 */
    .complete-screen {
      min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 40px 28px; text-align: center; gap: 20px;
    }
    .complete-emoji { font-size: 5rem; }
    .complete-title { font-family: 'Fredoka One', cursive; font-size: 2rem; color: #2D3436; }
    .complete-sub { font-size: 1rem; color: #888; font-weight: 600; }

    /* 부모 */
    .parent-screen {
      min-height: 100vh;
      background: linear-gradient(160deg, #E6FFF8 0%, #D0F5E8 100%);
      display: flex; flex-direction: column;
    }
    .pin-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.5);
      display: flex; align-items: flex-end; z-index: 100;
    }
    .pin-modal { background: #fff; border-radius: 28px 28px 0 0; padding: 32px 28px 48px; width: 100%; }
    .pin-modal h2 { font-family: 'Fredoka One', cursive; font-size: 1.5rem; color: #2D3436; text-align: center; margin-bottom: 6px; }
    .pin-modal p { text-align: center; color: #aaa; font-size: 0.9rem; margin-bottom: 24px; }
    .pin-dots { display: flex; gap: 12px; justify-content: center; margin-bottom: 24px; }
    .pin-dot { width: 18px; height: 18px; border-radius: 50%; background: #E0E0E0; transition: background 0.2s; }
    .pin-dot.filled { background: var(--parent-color); }
    .pin-keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .pin-key {
      height: 64px; border-radius: 16px; background: #F8F8F8;
      font-family: 'Fredoka One', cursive; font-size: 1.5rem; color: #2D3436;
      transition: background 0.12s, transform 0.12s;
    }
    .pin-key:active { background: #E0E0E0; transform: scale(0.94); }
    .pin-key.del { font-size: 1.1rem; color: #999; }
    .pin-key.empty { background: transparent; pointer-events: none; }

    .parent-tabs { display: flex; padding: 12px 20px 0; gap: 10px; }
    .parent-tab {
      flex: 1; padding: 12px;
      border-radius: var(--radius-md) var(--radius-md) 0 0;
      font-family: 'Fredoka One', cursive; font-size: 1rem;
      background: rgba(255,255,255,0.5); color: #888;
      transition: background 0.15s, color 0.15s;
    }
    .parent-tab.active { background: #fff; color: var(--parent-color); }
    .parent-content { flex: 1; background: #fff; padding: 24px 20px; overflow-y: auto; }
    .review-chapter-name { font-weight: 800; font-size: 0.92rem; color: #2D3436; }
    .review-chapter-status { font-size: 0.78rem; color: #aaa; margin-top: 2px; }
    .approve-btn {
      padding: 8px 16px; border-radius: 99px;
      font-family: 'Fredoka One', cursive; font-size: 0.88rem;
      color: #fff; background: var(--parent-color); transition: transform 0.12s;
      flex-shrink: 0;
    }
    .approve-btn:active { transform: scale(0.93); }

    /* 토스트 */
    .toast {
      position: fixed; bottom: 40px; left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: #2D3436; color: #fff; padding: 14px 28px;
      border-radius: 99px; font-weight: 700; font-size: 0.95rem;
      box-shadow: var(--shadow-card); transition: transform 0.3s ease;
      z-index: 999; white-space: nowrap; pointer-events: none;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.85; transform: scale(1.04); }
    }
    @keyframes recordPulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(214,48,49,0.4); }
      50% { box-shadow: 0 0 0 12px rgba(214,48,49,0); }
    }
  </style>

    // 챕터 내 진행상태 저장/불러오기
    const SESSION_KEY = "eng_homeschool_session";
    const saveSession = (data) => { try { localStorage.setItem(SESSION_KEY, JSON.stringify(data)); } catch {} };
    const loadSession = () => { try { return JSON.parse(localStorage.getItem(SESSION_KEY)) || null; } catch { return null; } };

    // ============================================================
    // IndexedDB — 녹음 영구 저장 (문장당 최신 1개만, 승인 시 삭제)
    // ============================================================
    const DB_NAME = "startalk_recordings";
    const DB_VERSION = 1;
    const STORE_NAME = "recordings";

    function openDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, DB_VERSION);
        req.onupgradeneeded = e => {
          e.target.result.createObjectStore(STORE_NAME);
        };
        req.onsuccess = e => resolve(e.target.result);
        req.onerror = () => reject(req.error);
      });
    }

    async function saveRecordingToDB(key, blob) {
      try {
        const db = await openDB();
        const tx = db.transaction(STORE_NAME, "readwrite");
        tx.objectStore(STORE_NAME).put(blob, key); // 최신 1개만 덮어쓰기
        return new Promise((resolve) => { tx.oncomplete = resolve; tx.onerror = resolve; });
      } catch(e) { console.warn("DB save failed", e); }
    }

    async function getRecordingFromDB(key) {
      try {
        const db = await openDB();
        const tx = db.transaction(STORE_NAME, "readonly");
        const req = tx.objectStore(STORE_NAME).get(key);
        return new Promise((resolve) => {
          req.onsuccess = () => resolve(req.result || null);
          req.onerror = () => resolve(null);
        });
      } catch(e) { return null; }
    }

    async function deleteChapterRecordings(childId, level, unitId, chapterId, sentenceCount) {
      try {
        const db = await openDB();
        const tx = db.transaction(STORE_NAME, "readwrite");
        const store = tx.objectStore(STORE_NAME);
        for (let s = 0; s < sentenceCount; s++) {
          store.delete(`c${childId}_${level}_U${unitId}_C${chapterId}_S${s}`);
        }
      } catch(e) { console.warn("DB delete failed", e); }
    }

    // ============================================================
    // TTS
    // ============================================================
    function speakSentence(text, onEnd) {
      window.speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = "en-US";
      utter.rate = 0.72;
      utter.pitch = 1.25;
      utter.volume = 1.0;
      // 음성 목록이 비동기로 로드될 수 있으므로 재시도
      const trySpeak = () => {
        const voices = window.speechSynthesis.getVoices();
        const preferred = voices.find(v =>
          v.lang.startsWith("en") && (
            v.name.includes("Samantha") || v.name.includes("Karen") ||
            v.name.includes("Moira") || v.name.includes("Google US English")
          )
        );
        if (preferred) utter.voice = preferred;
        if (onEnd) utter.onend = onEnd;
        window.speechSynthesis.speak(utter);
      };
      if (window.speechSynthesis.getVoices().length === 0) {
        window.speechSynthesis.onvoiceschanged = trySpeak;
      } else {
        trySpeak();
      }
    }

    // ============================================================
    // 마이크 권한 헬퍼
    // ============================================================
    async function requestMicPermission() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        stream.getTracks().forEach(t => t.stop()); // 즉시 해제 (권한만 받음)
        return "granted";
      } catch (e) {
        if (e.name === "NotAllowedError") return "denied";
        return "error";
      }
    }

    async function checkMicPermission() {
      if (!navigator.permissions) return "unknown";
      try {
        const result = await navigator.permissions.query({ name: "microphone" });
        return result.state; // "granted" | "denied" | "prompt"
      } catch {
        return "unknown";
      }
    }

    // ============================================================
    // useToast
    // ============================================================
    function useToast() {
      const [msg, setMsg] = useState("");
      const [visible, setVisible] = useState(false);
      const timerRef = useRef(null);
      const show = (text) => {
        if (timerRef.current) clearTimeout(timerRef.current);
        setMsg(text); setVisible(true);
        timerRef.current = setTimeout(() => setVisible(false), 2500);
      };
      return { msg, visible, show };
    }

    // ============================================================
    // 녹음 재생 행 (부모 화면) — IndexedDB에서 로드
    // ============================================================
    function RecordingRow({ sentence, recKey }) {
      const [blob, setBlob] = useState(null);
      const [playing, setPlaying] = useState(false);
      const [loaded, setLoaded] = useState(false);

      useEffect(() => {
        getRecordingFromDB(recKey).then(b => {
          setBlob(b);
          setLoaded(true);
        });
      }, [recKey]);

      if (!loaded) return (
        <div style={{ display:"flex", alignItems:"center", gap:10, padding:"8px 4px", opacity:0.5 }}>
          <span style={{ fontSize:"0.8rem", color:"#bbb" }}>⏳ 로딩중...</span>
        </div>
      );

      if (!blob) return (
        <div style={{ display:"flex", alignItems:"center", gap:10, padding:"8px 4px", opacity:0.4 }}>
          <span style={{ fontSize:"1rem" }}>🔇</span>
          <span style={{ fontSize:"0.78rem", color:"#aaa", flex:1 }}>{sentence}</span>
        </div>
      );

      function playRec() {
        if (!blob) return;
        // Android Chrome 호환: blob을 직접 FileReader로 base64 변환 후 재생
        const reader = new FileReader();
        reader.onload = (e) => {
          const audio = new Audio(e.target.result);
          setPlaying(true);
          audio.onended = () => setPlaying(false);
          audio.onerror = () => setPlaying(false);
          audio.play().catch(() => setPlaying(false));
        };
        reader.readAsDataURL(blob);
      }

      return (
        <div style={{ display:"flex", alignItems:"center", gap:10, padding:"10px 4px", borderBottom:"1px solid #f0f0f0" }}>
          <button onClick={playRec} disabled={playing} style={{
            width:38, height:38, borderRadius:"50%",
            background: playing ? "#FDCB6E" : "#00B89422",
            border:"none", fontSize:"1rem", cursor:"pointer",
            flexShrink:0, display:"flex", alignItems:"center", justifyContent:"center"
          }}>{playing ? "⏳" : "▶️"}</button>
          <span style={{ fontSize:"0.8rem", color:"#555", flex:1 }}>{sentence}</span>
          <span style={{ fontSize:"0.7rem", color:"#00B894", fontWeight:700, flexShrink:0 }}>✅ 녹음됨</span>
        </div>
      );
    }

    // ============================================================
    // 학습 화면
    // ============================================================
    const MIN_REPEATS = 5;

    function StudyScreen({ childId, level, unit, chapter, onComplete, onBack, accentColor, micStatus, onRequestMic }) {
      const sentences = chapter.sentences;
      const chapterKey = `c${childId}_${level}_U${unit.id}_C${chapter.id}`;

      // 이어하기: 저장된 세션 불러오기
      const savedSession = (() => {
        const s = loadSession();
        if (s && s.chapterKey === chapterKey) return s;
        return null;
      })();

      const [sentenceIdx, setSentenceIdx] = useState(savedSession ? savedSession.sentenceIdx : 0);
      const [phase, setPhase] = useState("listen");
      const [repeatCount, setRepeatCount] = useState(savedSession ? savedSession.repeatCount : 0);
      const [isPlaying, setIsPlaying] = useState(false);
      const [isRecording, setIsRecording] = useState(false);
      const [lastUrl, setLastUrl] = useState(null);
      const [done, setDone] = useState(false);
      const mediaRecorderRef = useRef(null);
      const chunksRef = useRef([]);
      const toast = useToast();

      const currentSentence = sentences[sentenceIdx];
      const isLastSentence = sentenceIdx === sentences.length - 1;
      const sentenceEmoji = getSentenceEmoji(currentSentence);
      const recordingKey = `c${childId}_${level}_U${unit.id}_C${chapter.id}_S${sentenceIdx}`;

      // 진행상태 변경될 때마다 저장
      useEffect(() => {
        saveSession({ chapterKey, sentenceIdx, repeatCount });
      }, [sentenceIdx, repeatCount]);

      useEffect(() => {
        setPhase("listen");
        setLastUrl(null);
        setIsPlaying(false);
        setIsRecording(false);
      }, [sentenceIdx]);

      function handleListen() {
        setIsPlaying(true);
        speakSentence(currentSentence, () => {
          setIsPlaying(false);
          setPhase("record");
        });
      }

      async function startRecording() {
        if (micStatus !== "granted") {
          const result = await requestMicPermission();
          if (result !== "granted") {
            toast.show("🎤 마이크 권한을 허용해주세요!");
            onRequestMic && onRequestMic(result);
            return;
          }
        }
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          const mr = new MediaRecorder(stream);
          mediaRecorderRef.current = mr;
          chunksRef.current = [];
          mr.ondataavailable = e => { if (e.data.size > 0) chunksRef.current.push(e.data); };
          mr.onstop = () => {
            stream.getTracks().forEach(t => t.stop());
            // Android Chrome 호환 포맷
            const mimeType = MediaRecorder.isTypeSupported("audio/webm;codecs=opus")
              ? "audio/webm;codecs=opus"
              : MediaRecorder.isTypeSupported("audio/webm")
              ? "audio/webm"
              : "audio/mp4";
            const blob = new Blob(chunksRef.current, { type: mimeType });
            // IndexedDB에 즉시 저장 (문장당 최신 1개 덮어쓰기)
            saveRecordingToDB(recordingKey, blob);
            // 재생용 URL — FileReader로 base64 변환 (Android 호환)
            const reader = new FileReader();
            reader.onload = (e) => setLastUrl(e.target.result);
            reader.readAsDataURL(blob);
            setIsRecording(false);
            setPhase("playback");
          };
          mr.start();
          setIsRecording(true);
        } catch (e) {
          toast.show("🎤 마이크 연결을 확인해주세요!");
        }
      }

      function stopRecording() {
        if (mediaRecorderRef.current && isRecording) mediaRecorderRef.current.stop();
      }

      function playMyRecording() {
        if (!lastUrl) return;
        const audio = new Audio(lastUrl); // base64 data URL — Android 호환
        setIsPlaying(true);
        audio.onended = () => setIsPlaying(false);
        audio.onerror = (e) => { setIsPlaying(false); };
        audio.play().catch(() => setIsPlaying(false));
      }

      function handleRepeatAgain() {
        setRepeatCount(c => c + 1);
        setPhase("listen");
      }

      function handleNextSentence() {
        setRepeatCount(c => c + 1);
        if (!isLastSentence) setSentenceIdx(i => i + 1);
        else setDone(true);
      }

      if (done) {
        clearSession(); // 완료 시 세션 삭제
        return (
          <div className="complete-screen" style={{ background: `linear-gradient(160deg, ${accentColor}22, ${accentColor}08)` }}>
            <div className="complete-emoji">🎉</div>
            <div className="complete-title">정말 잘했어요!</div>
            <div className="complete-sub">엄마 아빠한테 가서 보여줘요!</div>
            <button className="big-action-btn"
              style={{ background: `linear-gradient(135deg, ${accentColor}, ${accentColor}CC)`, marginTop:12 }}
              onClick={onComplete}>
              👨‍👩‍👧 엄마한테 가요!
            </button>
            <button className="nav-btn-sm" onClick={onBack} style={{ maxWidth:200 }}>← 뒤로가기</button>
          </div>
        );
      }

      const repeatDots = Array.from({ length: MIN_REPEATS }, (_, i) => i < repeatCount);
      const canGoNext = repeatCount >= MIN_REPEATS - 1;

      return (
        <div className="study-screen" style={{ background:`linear-gradient(160deg, ${accentColor}15, #fff 60%)` }}>
          <div className="study-header">
            <button className="back-btn" onClick={onBack}>←</button>
            <div className="study-progress-wrap">
              <div className="study-step-dots">
                {sentences.map((_, i) => (
                  <div key={i} className={`dot ${i===sentenceIdx?"active":i<sentenceIdx?"done":""}`}
                    style={i===sentenceIdx?{background:accentColor}:{}} />
                ))}
              </div>
            </div>
            <span style={{ fontFamily:"'Fredoka One',cursive", color:"#aaa", fontSize:"0.9rem" }}>
              {sentenceIdx+1}/{sentences.length}
            </span>
          </div>

          <div className="study-body">
            {/* 이모지 일러스트 */}
            <div style={{
              fontSize:"6rem", lineHeight:1, background:`${accentColor}18`,
              borderRadius:32, width:"100%", textAlign:"center", padding:"20px 0",
              boxShadow:`0 4px 24px ${accentColor}22`
            }}>{sentenceEmoji}</div>

            {/* 문장 */}
            <div className="sentence-box">
              <div className="sentence-num">SENTENCE {sentenceIdx+1}</div>
              <div className="sentence-text">{currentSentence}</div>
            </div>

            {/* 반복 도트 */}
            <div style={{ display:"flex", gap:8, alignItems:"center" }}>
              {repeatDots.map((filled, i) => (
                <div key={i} style={{
                  width:14, height:14, borderRadius:"50%",
                  background: filled ? accentColor : "#E0E0E0",
                  transition:"background 0.3s",
                  boxShadow: filled ? `0 0 6px ${accentColor}88` : "none"
                }} />
              ))}
              <span style={{ fontSize:"0.78rem", color:"#bbb", fontWeight:700, marginLeft:6 }}>
                {repeatCount}/{MIN_REPEATS}번
              </span>
            </div>

            {/* ── 듣기 ── */}
            {phase === "listen" && (
              <button className="big-action-btn"
                style={{ background: isPlaying
                  ? "linear-gradient(135deg,#74B9FF,#0984E3)"
                  : `linear-gradient(135deg,${accentColor},${accentColor}BB)` }}
                onClick={handleListen} disabled={isPlaying}>
                <span style={{ fontSize:"1.5rem" }}>{isPlaying?"⏳":"🔊"}</span>
                {isPlaying ? "듣는 중..." : "🔊 들어봐요!"}
              </button>
            )}

            {/* ── 녹음 ── */}
            {phase === "record" && (
              micStatus === "denied" ? (
                <div style={{ width:"100%", textAlign:"center", padding:16 }}>
                  <div style={{ fontSize:"2rem", marginBottom:8 }}>🚫</div>
                  <div style={{ fontSize:"0.85rem", color:"#c0392b", fontWeight:700 }}>
                    마이크 권한이 없어요<br/>
                    <span style={{ fontWeight:400, fontSize:"0.78rem" }}>
                      크롬 주소창 🔒 → 마이크 → 허용 후 새로고침
                    </span>
                  </div>
                </div>
              ) : !isRecording ? (
                <button className="big-action-btn"
                  style={{ background:"linear-gradient(135deg,#FF7675,#D63031)" }}
                  onClick={startRecording}>
                  <span style={{ fontSize:"1.5rem" }}>🎤</span> 따라 말해봐요!
                </button>
              ) : (
                <button className="big-action-btn"
                  style={{ background:"linear-gradient(135deg,#E17055,#D63031)",
                    animation:"recordPulse 1s infinite" }}
                  onClick={stopRecording}>
                  <span style={{ fontSize:"1.5rem" }}>⏹️</span> 녹음 중... (탭해서 멈춰요)
                </button>
              )
            )}

            {/* ── 내 녹음 듣기 ── */}
            {phase === "playback" && (
              <div style={{ width:"100%", display:"flex", flexDirection:"column", gap:12 }}>
                <button className="big-action-btn"
                  style={{ background: isPlaying
                    ? "linear-gradient(135deg,#FDCB6E,#E17055)"
                    : "linear-gradient(135deg,#FDCB6E,#F39C12)" }}
                  onClick={playMyRecording} disabled={isPlaying}>
                  <span style={{ fontSize:"1.5rem" }}>{isPlaying?"⏳":"▶️"}</span>
                  {isPlaying ? "듣는 중..." : "내 목소리 들어봐요!"}
                </button>

                <div className="nav-btns">
                  <button className="nav-btn-sm" onClick={handleRepeatAgain}>
                    🔁 한 번 더!
                  </button>
                  <button className="big-action-btn"
                    style={{
                      flex:1.5, fontSize:"1rem",
                      background: canGoNext
                        ? `linear-gradient(135deg,${accentColor},${accentColor}BB)`
                        : "linear-gradient(135deg,#B2BEC3,#636E72)",
                      opacity: canGoNext ? 1 : 0.7
                    }}
                    onClick={handleNextSentence}>
                    {isLastSentence && canGoNext ? "🎉 완료!" : "다음 →"}
                  </button>
                </div>

                {!canGoNext && (
                  <div style={{ textAlign:"center", fontSize:"0.8rem", color:"#bbb", fontWeight:700 }}>
                    💪 {MIN_REPEATS - repeatCount - 1}번 더 하면 다음으로 가요!
                  </div>
                )}
              </div>
            )}
          </div>

          {toast.visible && <div className="toast show">{toast.msg}</div>}
        </div>
      );
    }

    // ============================================================
    // 챕터 선택
    // ============================================================
    function ChapterScreen({ childId, unit, levelData, progress, onSelectChapter, onBack }) {
      const accentColor = levelData.color;
      const isUnlocked = (chapterId) => {
        if (chapterId === 1) return true;
        const prevKey = getChapterKey(childId, levelData.label, unit.id, chapterId - 1);
        return (progress[prevKey] || "") === "approved";
      };
      const completedCount = unit.chapters.filter(c => {
        const s = progress[getChapterKey(childId, levelData.label, unit.id, c.id)] || "";
        return s === "done" || s === "approved";
      }).length;

      return (
        <div className="page-screen" style={{ background:`linear-gradient(160deg,${levelData.bgColor},#fff 60%)` }}>
          <div className="page-header" style={{ background:"transparent" }}>
            <button className="back-btn" onClick={onBack}>←</button>
            <div>
              <div className="page-title">{unit.emoji} {unit.title}</div>
              <div style={{ fontSize:"0.78rem", color:"#aaa", fontWeight:600, marginTop:2 }}>
                {completedCount}/{unit.chapters.length} 챕터 완료
              </div>
            </div>
          </div>
          <div className="page-content">
            <div className="chapter-list">
              {unit.chapters.map(ch => {
                const unlocked = isUnlocked(ch.id);
                const status = progress[getChapterKey(childId, levelData.label, unit.id, ch.id)] || "";
                const icon = status==="approved" ? "⭐" : status==="done" ? "✅" : unlocked ? "▶️" : "🔒";
                return (
                  <button key={ch.id}
                    className={`chapter-item ${!unlocked?"locked":""}`}
                    onClick={() => unlocked && onSelectChapter(ch)}
                    disabled={!unlocked}>
                    <div className="chapter-num" style={{ background: unlocked ? accentColor : "#ccc" }}>{ch.id}</div>
                    <div className="chapter-info">
                      <div className="chapter-title">Chapter {ch.id}</div>
                      <div className="chapter-preview">{ch.sentences[0].slice(0,30)}…</div>
                    </div>
                    <div className="chapter-status">{icon}</div>
                  </button>
                );
              })}
            </div>
          </div>
        </div>
      );
    }

                  <button key={unit.id} className="unit-card"
                    style={{ borderLeftColor: levelData.color }}
                    onClick={() => onSelectUnit(unit)}>
                    <div className="unit-emoji">{unit.emoji}</div>
                    <div className="unit-info">
                      <div className="unit-name">{unit.title}</div>
                      <div className="unit-meta">Unit {unit.id} · {total} chapters</div>
                      <div className="unit-progress-bar">
                        <div className="unit-progress-fill"
                          style={{ width:`${total>0?(done/total)*100:0}%`, background:levelData.color }} />
                      </div>
                    </div>
                    <div style={{ color:"#ccc", fontSize:"1.2rem" }}>›</div>
                  </button>
                );
              })}
            </div>
          </div>
        </div>
      );
    }

    // ============================================================
    // 부모 화면
    // ============================================================
    const PARENT_PIN = "1234";

    function ParentScreen({ progress, onApprove, onBack }) {
      const [pinInput, setPinInput] = useState("");
      const [unlocked, setUnlocked] = useState(false);
      const [activeChild, setActiveChild] = useState(1);
      const [pinError, setPinError] = useState(false);

      function handleKey(k) {
        if (k === "del") { setPinInput(p => p.slice(0,-1)); return; }
        const next = pinInput + k;
        if (next.length > 4) return;
        setPinInput(next);
        if (next.length === 4) {
          if (next === PARENT_PIN) setTimeout(() => setUnlocked(true), 300);
          else { setPinError(true); setTimeout(() => { setPinInput(""); setPinError(false); }, 800); }
        }
      }

      function getPendingItems(childId) {
        const level = childId === 1 ? CURRICULUM[2] : CURRICULUM[1];
        const items = [];
        for (const unit of level.units) {
          for (const ch of unit.chapters) {
            const key = getChapterKey(childId, level.label, unit.id, ch.id);
            if (progress[key] === "done") items.push({ unit, chapter:ch, key, level });
          }
        }
        return items;
      }

      if (!unlocked) return (
        <div style={{ minHeight:"100vh", background:"#f8f8f8" }}>
          <div className="page-header" style={{ padding:"20px 20px 0" }}>
            <button className="back-btn" onClick={onBack}>←</button>
            <div className="page-title">부모 모드</div>
          </div>
          <div className="pin-overlay">
            <div className="pin-modal">
              <h2>🔐 비밀번호 입력</h2>
              <p>부모 검토 화면입니다 (기본: 1234)</p>
              <div className="pin-dots">
                {[0,1,2,3].map(i => (
                  <div key={i} className={`pin-dot ${i<pinInput.length?"filled":""}`}
                    style={pinError?{background:"#FF7675"}:{}} />
                ))}
              </div>
              <div className="pin-keypad">
                {["1","2","3","4","5","6","7","8","9","","0","del"].map((k,i) => (
                  <button key={i}
                    className={`pin-key ${k==="del"?"del":k===""?"empty":""}`}
                    onClick={() => k && handleKey(k)}>
                    {k==="del"?"⌫":k}
                  </button>
                ))}
              </div>
            </div>
          </div>
        </div>
      );

      const pendingItems = getPendingItems(activeChild);
      const levelForChild = activeChild === 1 ? CURRICULUM[2] : CURRICULUM[1];

      return (
        <div className="parent-screen">
          <div className="page-header">
            <button className="back-btn" onClick={onBack}>←</button>
            <div className="page-title">👨‍👩‍👧 부모 검토</div>
          </div>
          <div className="parent-tabs">
            {[1,2].map(c => (
              <button key={c} className={`parent-tab ${activeChild===c?"active":""}`}
                style={activeChild===c ? {color: c===1?"#FF9F43":"#6C5CE7"} : {}}
                onClick={() => setActiveChild(c)}>
                {c===1 ? "🚀 첫째" : "🌱 둘째"}
              </button>
            ))}
          </div>
          <div className="parent-content">
            {pendingItems.length === 0 ? (
              <div style={{ textAlign:"center", padding:"60px 0", color:"#ccc" }}>
                <div style={{ fontSize:"3rem", marginBottom:12 }}>📭</div>
                <div style={{ fontFamily:"'Fredoka One',cursive", fontSize:"1.1rem" }}>
                  검토 대기 중인 챕터가 없어요
                </div>
              </div>
            ) : (
              pendingItems.map(({ unit, chapter, key, level }) => {
                return (
                  <div key={key} style={{ marginBottom:20, background:"#F8F9FA", borderRadius:20, padding:"16px 18px" }}>
                    <div style={{ display:"flex", alignItems:"center", gap:12, marginBottom:12 }}>
                      <div style={{ fontSize:"1.8rem" }}>{unit.emoji}</div>
                      <div style={{ flex:1 }}>
                        <div className="review-chapter-name">{unit.title} · Chapter {chapter.id}</div>
                        <div className="review-chapter-status">{chapter.sentences[0].slice(0,26)}…</div>
                      </div>
                      <button className="approve-btn" onClick={() => onApprove(key, activeChild, level.label, unit.id, chapter.id, chapter.sentences.length)}>⭐ 승인</button>
                    </div>
                    {chapter.sentences.map((sent, sIdx) => {
                      const recKey = `c${activeChild}_${level.label}_U${unit.id}_C${chapter.id}_S${sIdx}`;
                      return <RecordingRow key={sIdx} sentence={sent} recKey={recKey} />;
                    })}
                  </div>
                );
              })
            )}
            <div style={{ marginTop:32, padding:"20px", background:"#F8F8F8", borderRadius:16 }}>
              <div style={{ fontFamily:"'Fredoka One',cursive", fontSize:"0.95rem", color:"#aaa", marginBottom:8 }}>
                💡 승인하면 다음 챕터가 열려요
              </div>
              <div style={{ fontSize:"0.8rem", color:"#bbb", lineHeight:1.6 }}>
                각 문장 ▶️ 버튼으로 아이 녹음을 들어보세요.<br/>
                잘 따라했으면 ⭐ 승인 버튼을 눌러주세요.
              </div>
            </div>
          </div>
        </div>
      );
    }

    // ============================================================
    // 메인 앱
    // ============================================================
    function App() {
      const [screen, setScreen] = useState("home");
      const [activeChild, setActiveChild] = useState(null);
      const [selectedUnit, setSelectedUnit] = useState(null);
      const [selectedChapter, setSelectedChapter] = useState(null);
      const [progress, setProgress] = useState(loadProgress);
      const [micStatus, setMicStatus] = useState("unknown"); // unknown|prompt|granted|denied
      const toast = useToast();

      // 앱 시작 시 마이크 권한 상태 확인
      useEffect(() => {
        checkMicPermission().then(setMicStatus);
        // TTS 음성 미리 로드
        if (window.speechSynthesis) window.speechSynthesis.getVoices();
      }, []);

      async function handleRequestMic() {
        const result = await requestMicPermission();
        setMicStatus(result === "granted" ? "granted" : "denied");
        if (result === "granted") toast.show("🎤 마이크 연결됐어요!");
      }

      function updateProgress(key, status) {
        setProgress(prev => {
          const next = { ...prev, [key]: status };
          saveProgress(next);
          return next;
        });
      }

      function handleApprove(key, childId, level, unitId, chapterId, sentenceCount) {
        updateProgress(key, "approved");
        // 승인 후 녹음 삭제 (용량 관리)
        if (childId && sentenceCount) {
          deleteChapterRecordings(childId, level, unitId, chapterId, sentenceCount);
        }
        toast.show("⭐ 승인 완료! 다음 챕터가 열렸어요");
      }

      function handleChapterComplete() {
        const levelData = activeChild === 1 ? CURRICULUM[2] : CURRICULUM[1];
        const key = getChapterKey(activeChild, levelData.label, selectedUnit.id, selectedChapter.id);
        updateProgress(key, "done");
        setScreen("chapters");
        toast.show("🎉 챕터 완료! 부모님 확인을 받아요");
      }

      const levelData = activeChild ? (activeChild === 1 ? CURRICULUM[2] : CURRICULUM[1]) : null;
      const approvedCount = Object.values(progress).filter(v => v === "approved").length;

      return (
        <div className="app-root">
          {screen === "home" && (
            <div className="home-screen">
              <div className="home-logo">⭐ Star<span>Talk</span></div>
              <div className="home-subtitle">우리 아이 영어 홈스쿨링</div>

              {/* 마이크 권한 배너 */}
              <div style={{ width:"100%", maxWidth:360, marginBottom: micStatus==="granted"?0:4 }}>
                <MicPermissionBanner micStatus={micStatus} onRequest={handleRequestMic} />
              </div>

              <div className="home-cards">
                <button className="profile-card child1"
                  onClick={() => { setActiveChild(1); setScreen("units"); }}>
                  <div className="profile-emoji">🚀</div>
                  <div className="profile-info">
                    <div className="profile-name">첫째</div>
                    <div className="profile-level">Level 2 · 부사구/to부정사</div>
                    <div className="profile-progress">{approvedCount}챕터 완료</div>
                  </div>
                  <div className="profile-arrow">›</div>
                </button>

                <button className="profile-card child2"
                  onClick={() => { setActiveChild(2); setScreen("units"); }}>
                  <div className="profile-emoji">🌱</div>
                  <div className="profile-info">
                    <div className="profile-name">둘째</div>
                    <div className="profile-level">Level 1 · 3형식 문장</div>
                    <div className="profile-progress">내 속도로 배워요</div>
                  </div>
                  <div className="profile-arrow">›</div>
                </button>

                <button className="profile-card parent"
                  onClick={() => setScreen("parent")}>
                  <div className="profile-emoji">👨‍👩‍👧</div>
                  <div className="profile-info">
                    <div className="profile-name">부모 모드</div>
                    <div className="profile-level">검토 · 승인 · 피드백</div>
                    <div className="profile-progress">🔒 PIN 잠금</div>
                  </div>
                  <div className="profile-arrow">›</div>
                </button>
              </div>

              {/* PWA 안내 */}
              <div style={{
                marginTop:32, fontSize:"0.75rem", color:"#ccc",
                textAlign:"center", lineHeight:1.8
              }}>
                📱 크롬 메뉴 → "홈 화면에 추가" 하면<br/>앱처럼 사용할 수 있어요!
              </div>
            </div>
          )}

          {screen === "units" && levelData && (
            <UnitScreen
              childId={activeChild} levelData={levelData} progress={progress}
              onSelectUnit={(u) => { setSelectedUnit(u); setScreen("chapters"); }}
              onBack={() => setScreen("home")} />
          )}

          {screen === "chapters" && selectedUnit && levelData && (
            <ChapterScreen
              childId={activeChild} unit={selectedUnit} levelData={levelData} progress={progress}
              onSelectChapter={(ch) => { setSelectedChapter(ch); setScreen("study"); }}
              onBack={() => setScreen("units")} />
          )}

          {screen === "study" && selectedChapter && levelData && (
            <StudyScreen
              childId={activeChild} level={levelData.label}
              unit={selectedUnit} chapter={selectedChapter}
              onComplete={handleChapterComplete}
              onBack={() => setScreen("chapters")}
              accentColor={levelData.color}
              micStatus={micStatus}
              onRequestMic={(result) => setMicStatus(result === "granted" ? "granted" : "denied")}
            />
          )}

          {screen === "parent" && (
            <ParentScreen
              progress={progress}
              onApprove={handleApprove}
              onBack={() => setScreen("home")} />
          )}

          {toast.visible && <div className="toast show">{toast.msg}</div>}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
